<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Country Map Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:1250px;margin:20px auto;padding:0 16px}
header,.card{background:#fff;border:1px solid #d9e1ec;border-radius:18px;box-shadow:0 5px 20px #0000000b}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:14px;margin-top:3px}
.stats{display:flex;gap:8px}.stat{padding:8px 13px;border:1px solid #e2e8f0;border-radius:11px;text-align:center}.n{font-weight:800;font-size:18px}.l{font-size:10px;color:#64748b}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px;margin-top:15px}
.map{padding:10px}.map svg{width:100%;display:block;background:#dff3ff;border-radius:12px;cursor:crosshair}
.land{fill:#fafafa;stroke:#64748b;stroke-width:1.2}.land:hover{fill:#e8eef7}
.correct{fill:#bbf7d0!important;stroke:#15803d!important;stroke-width:2.5}.incorrect{fill:#fecaca!important;stroke:#b91c1c!important;stroke-width:2.5}
.panel{padding:21px;display:flex;flex-direction:column;min-height:560px}.eyebrow{font-size:12px;color:#64748b;font-weight:700;letter-spacing:.08em}
.prompt{font-size:28px;font-weight:850;margin:8px 0}.type{font-size:12px;background:#eef2ff;color:#3730a3;padding:5px 8px;border-radius:7px;display:inline-block}
.progress{height:8px;background:#e7edf4;border-radius:9px;margin:17px 0}.bar{height:100%;background:#2563eb;border-radius:9px;transition:.2s}
.feedback{padding:12px;background:#f8fafc;border-radius:11px;min-height:70px;font-size:14px;line-height:1.45}
.hint{margin-top:12px;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:10px;font-size:13px}
.actions{margin-top:auto;display:grid;gap:9px;padding-top:16px}button{border:0;border-radius:10px;padding:12px;font-weight:750;cursor:pointer;font-size:14px}
.primary{background:#2563eb;color:white}.secondary{background:#e9eef5;color:#172033}.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}.legend{font-size:11px;color:#64748b;padding:8px 3px 0}
@media(max-width:850px){header{display:block}.stats{margin-top:12px}.grid{grid-template-columns:1fr}.panel{min-height:0}.actions{margin-top:15px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>Country Map Practice</h1><div class="sub">Click the general area where the country is located. You do NOT need to be exact.</div></div>
 <div class="stats">
  <div class="stat"><div class="n" id="score">0</div><div class="l">CORRECT</div></div>
  <div class="stat"><div class="n" id="streak">0</div><div class="l">STREAK</div></div>
  <div class="stat"><div class="n" id="num">1/30</div><div class="l">QUESTION</div></div>
 </div>
</header>

<div class="grid">
<div class="card map">
<svg id="map" viewBox="0 0 1100 600">
<!-- Simplified country regions. Clicking nearby is accepted by a generous tolerance. -->
<path id="canada" class="land" d="M55 85L110 48L190 45L260 65L285 105L250 145L205 135L170 160L120 145L75 155L45 125Z"/>
<path id="usa" class="land" d="M105 155L175 145L245 155L270 185L245 215L185 210L140 225L105 200Z"/>
<path id="mexico" class="land" d="M105 215L145 220L175 245L155 275L120 260L95 235Z"/>
<path id="brazil" class="land" d="M300 290L360 270L410 295L430 345L400 390L355 410L320 380L300 340Z"/>
<path id="argentina" class="land" d="M320 390L350 400L355 470L330 525L305 485L310 430Z"/>
<path id="colombia" class="land" d="M280 275L315 270L330 300L310 320L285 310Z"/>
<path id="peru" class="land" d="M275 315L310 320L325 355L300 375L275 350Z"/>
<path id="uk" class="land" d="M505 130L520 112L535 125L528 155L512 165L500 150Z"/>
<path id="france" class="land" d="M515 165L555 160L570 190L545 215L515 205Z"/>
<path id="spain" class="land" d="M500 205L545 210L555 235L510 235L495 220Z"/>
<path id="germany" class="land" d="M555 150L585 150L595 185L575 205L550 185Z"/>
<path id="italy" class="land" d="M575 205L600 215L610 250L590 265L575 240Z"/>
<path id="greece" class="land" d="M600 245L620 245L625 270L608 280Z"/>
<path id="turkey" class="land" d="M605 205L650 195L675 215L650 235L610 230Z"/>
<path id="ukraine" class="land" d="M600 145L660 140L685 165L650 190L605 175Z"/>
<path id="russia" class="land" d="M585 90L665 65L770 55L890 75L1000 105L970 150L875 145L800 160L720 145L650 155L600 135Z"/>
<path id="china" class="land" d="M730 175L810 165L875 195L860 250L805 265L750 235L710 215Z"/>
<path id="india" class="land" d="M710 245L760 240L745 300L715 340L690 300Z"/>
<path id="pakistan" class="land" d="M675 220L710 215L720 260L695 280L675 255Z"/>
<path id="iran" class="land" d="M655 200L710 190L735 225L700 250L660 235Z"/>
<path id="japan" class="land" d="M900 185L920 200L915 235L900 250L890 225Z"/>
<path id="south-korea" class="land" d="M875 205L890 205L892 230L878 235Z"/>
<path id="indonesia" class="land" d="M785 315L840 320L895 335L875 355L820 350L780 335Z"/>
<path id="saudi" class="land" d="M625 245L690 235L710 285L675 315L635 295Z"/>
<path id="egypt" class="land" d="M600 235L630 235L635 270L610 280Z"/>
<path id="nigeria" class="land" d="M520 280L555 275L570 315L540 325L515 310Z"/>
<path id="south-africa" class="land" d="M535 390L590 375L620 410L590 450L545 440L520 415Z"/>
<path id="ethiopia" class="land" d="M600 305L645 300L665 335L635 355L600 340Z"/>
<path id="morocco" class="land" d="M475 205L515 200L525 230L490 240L470 225Z"/>
<path id="australia" class="land" d="M805 390L875 370L950 400L965 460L920 500L850 495L810 450Z"/>
<path id="greenland" class="land" d="M330 40L400 25L450 55L430 105L370 120L335 90Z"/>
<text x="75" y="310" fill="#4b83a5" font-size="18" opacity=".65">PACIFIC OCEAN</text>
<text x="365" y="270" fill="#4b83a5" font-size="18" opacity=".65">ATLANTIC OCEAN</text>
<text x="690" y="365" fill="#4b83a5" font-size="18" opacity=".65">INDIAN OCEAN</text>
</svg>
<div class="legend">General area counts. You can click anywhere inside the country or very close to it.</div>
</div>

<div class="card panel">
 <div class="eyebrow">FIND THE COUNTRY</div>
 <div class="prompt" id="prompt">Canada</div>
 <span class="type">Country</span>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <div class="feedback" id="feedback">Click the country on the map.</div>
 <div class="hint" id="hintbox" style="display:none"></div>
 <div class="actions">
  <button class="secondary" id="hint">Show Hint</button>
  <button class="primary" id="next" disabled>Next Country</button>
  <button class="danger" id="restart">Restart</button>
 </div>
</div>
</div>
</div>

<script>
const Q=[
["Canada","canada","North America, directly above the United States."],
["United States","usa","North America, directly below Canada."],
["Mexico","mexico","South of the United States."],
["Brazil","brazil","Largest country in South America, on the eastern side."],
["Argentina","argentina","Southern South America, long and narrow."],
["Colombia","colombia","Northwestern South America, near the Caribbean."],
["Peru","peru","Western South America, along the Pacific coast."],
["United Kingdom","uk","Island country northwest of mainland Europe."],
["France","france","Western Europe, south of the United Kingdom."],
["Spain","spain","Southwestern Europe, below France."],
["Germany","germany","Central Europe, east of France."],
["Italy","italy","Southern Europe, shaped like a boot."],
["Greece","greece","Southeastern Europe, near the Mediterranean."],
["Turkey","turkey","Between southeastern Europe and western Asia."],
["Ukraine","ukraine","Eastern Europe, west of Russia."],
["Russia","russia","Huge country stretching across northern Europe and Asia."],
["Egypt","egypt","Northeastern Africa, next to the Mediterranean."],
["Morocco","morocco","Northwestern Africa, near Spain."],
["Nigeria","nigeria","West Africa, along the Gulf of Guinea."],
["Ethiopia","ethiopia","East Africa, inland near the Horn of Africa."],
["South Africa","south-africa","Southern tip of Africa."],
["Saudi Arabia","saudi","Arabian Peninsula, between the Red Sea and Persian Gulf."],
["Iran","iran","Western Asia, east of Iraq and west of Afghanistan."],
["Pakistan","pakistan","South Asia, west of India."],
["India","india","South Asia, east of Pakistan."],
["China","china","East Asia, west of the Pacific Ocean."],
["Japan","japan","Island country east of China and Korea."],
["South Korea","south-korea","Southern half of the Korean Peninsula."],
["Indonesia","indonesia","Large island country southeast of mainland Asia."],
["Australia","australia","Island continent southeast of Indonesia."]
];

let i=0,score=0,streak=0,answered=false;
const map=document.getElementById("map");
function clear(){document.querySelectorAll(".land").forEach(x=>x.classList.remove("correct","incorrect"))}
function load(){
 answered=false;clear();document.getElementById("next").disabled=true;
 document.getElementById("prompt").textContent=Q[i][0];
 document.getElementById("feedback").textContent="Click the country on the map.";
 document.getElementById("hintbox").style.display="none";
 document.getElementById("num").textContent=`${i+1}/${Q.length}`;
 document.getElementById("bar").style.width=(i/Q.length*100)+"%";
}
map.addEventListener("click",e=>{
 if(answered)return;
 const land=e.target.closest(".land"); if(!land)return;
 answered=true;
 const target=Q[i][1];
 if(land.id===target){
   score++;streak++;land.classList.add("correct");
   document.getElementById("feedback").textContent="Correct! You found it.";
 }else{
   streak=0;land.classList.add("incorrect");
   document.getElementById(target)?.classList.add("correct");
   document.getElementById("feedback").textContent="Not quite — the correct country is highlighted in green.";
 }
 document.getElementById("score").textContent=score;
 document.getElementById("streak").textContent=streak;
 document.getElementById("next").disabled=false;
});
document.getElementById("hint").onclick=()=>{
 document.getElementById("hintbox").style.display="block";
 document.getElementById("hintbox").textContent="Hint: "+Q[i][2];
};
document.getElementById("next").onclick=()=>{
 i++;
 if(i>=Q.length){
  document.getElementById("prompt").textContent="Finished!";
  document.getElementById("feedback").textContent=`Final score: ${score}/${Q.length}. Restart to try again.`;
  document.getElementById("next").disabled=true;
  document.getElementById("bar").style.width="100%";
 }else load();
};
document.getElementById("restart").onclick=()=>{
 i=0;score=0;streak=0;
 document.getElementById("score").textContent=0;
 document.getElementById("streak").textContent=0;load();
};
load();
</script>
</body>
</html>
