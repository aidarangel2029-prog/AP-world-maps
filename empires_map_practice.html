<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empires Map Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:1450px;margin:16px auto;padding:0 14px}header,.card{background:#fff;border:1px solid #d7e0eb;border-radius:18px;box-shadow:0 5px 20px #0000000b}
header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0;font-size:24px}.sub{color:#64748b;font-size:13px;margin-top:3px}
.stats{display:flex;gap:7px}.stat{padding:7px 12px;border:1px solid #e2e8f0;border-radius:10px;text-align:center}.n{font-weight:800;font-size:18px}.l{font-size:9px;color:#64748b}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:13px;margin-top:13px}.map{padding:9px}.map svg{width:100%;display:block;background:#dff3ff;border-radius:12px}
.panel{padding:19px;display:flex;flex-direction:column;min-height:560px}.eyebrow{font-size:11px;color:#64748b;font-weight:800;letter-spacing:.08em}.prompt{font-size:28px;font-weight:850;margin:7px 0}
.progress{height:8px;background:#e7edf4;border-radius:9px;margin:15px 0}.bar{height:100%;background:#2563eb;border-radius:9px}.feedback{padding:11px;background:#f8fafc;border-radius:10px;min-height:72px;font-size:14px;line-height:1.4}
.hint{margin-top:10px;background:#eff6ff;color:#1d4ed8;border-radius:9px;padding:9px;font-size:13px}.actions{margin-top:auto;display:grid;gap:8px;padding-top:14px}
button{border:0;border-radius:9px;padding:11px;font-weight:750;cursor:pointer;font-size:14px}.primary{background:#2563eb;color:#fff}.secondary{background:#e9eef5;color:#172033}.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.45;cursor:not-allowed}
.country{fill:#fff;stroke:#74808e;stroke-width:.55}.hit{cursor:pointer}.hit:hover{opacity:.78}.good{fill:#16a34a!important;stroke:#15803d!important}.bad{fill:#dc2626!important;stroke:#b91c1c!important}
.loading{text-align:center;padding:40px;color:#64748b}.legend{font-size:11px;color:#64748b;padding:7px 2px}
@media(max-width:850px){header{display:block}.stats{margin-top:10px}.grid{grid-template-columns:1fr}.panel{min-height:0}}
</style>
</head><body><div class="app">
<header><div><h1>Empires Map Practice</h1><div class="sub">The empires/countries listed on your AP World summer assignment. Historical shapes are approximate so you can practice the general location.</div></div><div class="stats"><div class="stat"><div class="n" id="score">0</div><div class="l">CORRECT</div></div><div class="stat"><div class="n" id="streak">0</div><div class="l">STREAK</div></div><div class="stat"><div class="n" id="num">1/18</div><div class="l">QUESTION</div></div></div></header>
<div class="grid"><div class="card map" id="map"><div class="loading">Loading realistic world map…</div></div><div class="card panel"><div class="eyebrow">FIND IT ON THE MAP</div><div class="prompt" id="prompt">Loading…</div><div class="progress"><div class="bar" id="bar"></div></div><div class="feedback" id="feedback">Click the general area.</div><div class="hint" id="hintbox" style="display:none"></div><div class="actions"><button class="secondary" id="hint">Show Hint</button><button class="primary" id="next" disabled>Next</button><button class="danger" id="restart">Restart & Shuffle</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script>
const ITEMS=[{"name": "Mayan", "hint": "Mesoamerica: southern Mexico and northern Central America.", "path": [[-92, 22], [-86, 22], [-84, 16], [-89, 14], [-94, 17]]}, {"name": "Aztec", "hint": "Central Mexico, around the Valley of Mexico.", "path": [[-103, 24], [-96, 24], [-96, 18], [-102, 17], [-106, 20]]}, {"name": "Inca", "hint": "Western South America along the Andes.", "path": [[-80, -5], [-67, -5], [-68, -28], [-75, -20], [-82, -10]]}, {"name": "Mongol Empire", "hint": "A huge belt across Mongolia and much of northern Eurasia.", "path": [[80, 55], [125, 55], [145, 42], [105, 38], [75, 45]]}, {"name": "China", "hint": "East Asia, centered on the eastern side of the continent.", "path": [[74, 50], [135, 50], [135, 20], [105, 18], [85, 30]]}, {"name": "India", "hint": "South Asia, the large peninsula below the Himalayas.", "path": [[68, 35], [90, 34], [90, 7], [72, 7], [66, 20]]}, {"name": "Japan", "hint": "Island chain east of China and Korea.", "path": [[129, 45], [146, 45], [146, 30], [130, 30]]}, {"name": "Arab World", "hint": "North Africa and Southwest Asia, from Morocco toward Arabia.", "path": [[-15, 36], [40, 36], [60, 30], [55, 12], [30, 5], [-5, 10], [-15, 20]]}, {"name": "Mali", "hint": "West Africa, inland south of the Sahara.", "path": [[-12, 25], [5, 25], [5, 10], [-10, 10], [-12, 18]]}, {"name": "Ghana", "hint": "West Africa, along the Gulf of Guinea.", "path": [[-4, 12], [2, 12], [2, 5], [-3, 5]]}, {"name": "Britain", "hint": "Island northwest of mainland Europe.", "path": [[-8, 59], [2, 59], [2, 50], [-7, 50]]}, {"name": "France", "hint": "Western Europe, south of Britain.", "path": [[-5, 51], [8, 51], [8, 43], [-2, 43]]}, {"name": "Germany", "hint": "Central Europe, east of France.", "path": [[5, 55], [15, 55], [15, 47], [6, 47]]}, {"name": "Russia", "hint": "Enormous territory across northern Europe and Asia.", "path": [[30, 70], [170, 70], [170, 45], [110, 40], [40, 45]]}, {"name": "Ottoman", "hint": "Centered in Anatolia and extending around the eastern Mediterranean.", "path": [[25, 45], [45, 45], [45, 30], [25, 30]]}, {"name": "Iran/Persia", "hint": "Southwest/Central Asia, east of Mesopotamia.", "path": [[44, 40], [64, 40], [64, 24], [44, 24]]}, {"name": "Indonesia", "hint": "Island region between mainland Southeast Asia and Australia.", "path": [[95, 8], [145, 8], [145, -10], [100, -10]]}, {"name": "Kilwa/Zimbabwe", "hint": "East/southeast Africa around the Swahili coast and Zimbabwe region.", "path": [[28, -2], [42, -2], [38, -25], [28, -25]]}]; let q=[],i=0,score=0,streak=0,answered=false,svg,proj,shapes;
function shuffle(a){for(let j=a.length-1;j;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function load(){answered=false;next.disabled=true;prompt.textContent=q[i].name;feedback.textContent="Click the general area of the empire.";hintbox.style.display="none";num.textContent=`${i+1}/${q.length}`;bar.style.width=(i/q.length*100)+"%";shapes.classed("good",false).classed("bad",false)}
function draw(d){map.innerHTML="";svg=d3.select("#map").append("svg").attr("viewBox","0 0 1200 650");svg.append("rect").attr("width",1200).attr("height",650).attr("rx",12).attr("fill","#dff3ff");proj=d3.geoNaturalEarth1().fitExtent([[8,8],[1192,642]],{type:"FeatureCollection",features:d.features});let path=d3.geoPath(proj);svg.selectAll(".country").data(d.features).join("path").attr("class","country").attr("d",path);
shapes=svg.selectAll(".hit").data(ITEMS).join("path").attr("class","hit").attr("fill","#64748b").attr("fill-opacity",".10").attr("stroke","#64748b").attr("stroke-width","1.5").attr("d",x=>x.path.map((p,j)=>(j?"L":"M")+proj(p)[0]+","+proj(p)[1]).join("")+"Z").on("click",function(e,x){answer(x,this)})}
function answer(x,n){if(answered)return;answered=true;let t=q[i],good=x.name===t.name;if(good){score++;streak++;n.classList.add("good");feedback.textContent="Correct!"}else{streak=0;n.classList.add("bad");shapes.filter(d=>d.name===t.name).classed("good",true);feedback.textContent="Not quite — the correct region is green."}scoreEl.textContent=score;streakEl.textContent=streak;next.disabled=false}

const map=document.getElementById("map"),prompt=document.getElementById("prompt"),feedback=document.getElementById("feedback"),hintbox=document.getElementById("hintbox"),next=document.getElementById("next"),bar=document.getElementById("bar"),num=document.getElementById("num"),scoreEl=document.getElementById("score"),streakEl=document.getElementById("streak");
document.getElementById("hint").onclick=()=>{hintbox.style.display="block";hintbox.textContent="Hint: "+q[i].hint};
next.onclick=()=>{i++;if(i<q.length)load();else{prompt.textContent="Finished!";feedback.textContent=`Final score: ${score}/${q.length}. Restart for a new order.`;next.disabled=true;bar.style.width="100%"}};
document.getElementById("restart").onclick=()=>{q=shuffle([...ITEMS]);i=0;score=0;streak=0;scoreEl.textContent=0;streakEl.textContent=0;load()};
fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson").then(r=>r.json()).then(d=>{draw(d);q=shuffle([...ITEMS]);load()}).catch(()=>map.innerHTML='<div class="loading">Map could not load. Refresh while connected to the internet.</div>');
</script></body></html>
