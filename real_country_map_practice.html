<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real World Country Map Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:1250px;margin:20px auto;padding:0 16px}
header,.card{background:#fff;border:1px solid #d9e1ec;border-radius:18px;box-shadow:0 5px 20px #0000000b}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:14px;margin-top:3px}
.stats{display:flex;gap:8px}.stat{padding:8px 13px;border:1px solid #e2e8f0;border-radius:11px;text-align:center}.n{font-weight:800;font-size:18px}.l{font-size:10px;color:#64748b}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px;margin-top:15px}
.map{padding:10px}.map svg{width:100%;height:auto;display:block;background:#dff3ff;border-radius:12px}
.country{fill:#fff;stroke:#64748b;stroke-width:.65;cursor:pointer;transition:.12s}.country:hover{fill:#e8eef7}
.correct{fill:#bbf7d0!important;stroke:#15803d!important;stroke-width:1.7}.incorrect{fill:#fecaca!important;stroke:#b91c1c!important;stroke-width:1.7}
.panel{padding:21px;display:flex;flex-direction:column;min-height:560px}.eyebrow{font-size:12px;color:#64748b;font-weight:700;letter-spacing:.08em}
.prompt{font-size:28px;font-weight:850;margin:8px 0}.progress{height:8px;background:#e7edf4;border-radius:9px;margin:17px 0}.bar{height:100%;background:#2563eb;border-radius:9px;transition:.2s}
.feedback{padding:12px;background:#f8fafc;border-radius:11px;min-height:70px;font-size:14px;line-height:1.45}
.hint{margin-top:12px;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:10px;font-size:13px}
.actions{margin-top:auto;display:grid;gap:9px;padding-top:16px}button{border:0;border-radius:10px;padding:12px;font-weight:750;cursor:pointer;font-size:14px}
.primary{background:#2563eb;color:white}.secondary{background:#e9eef5;color:#172033}.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}.legend{font-size:11px;color:#64748b;padding:8px 3px 0}
.loading{padding:30px;text-align:center;color:#64748b}
@media(max-width:850px){header{display:block}.stats{margin-top:12px}.grid{grid-template-columns:1fr}.panel{min-height:0}.actions{margin-top:15px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>Real Country Map Practice</h1><div class="sub">Real country boundaries • general area counts • randomized every restart</div></div>
 <div class="stats">
  <div class="stat"><div class="n" id="score">0</div><div class="l">CORRECT</div></div>
  <div class="stat"><div class="n" id="streak">0</div><div class="l">STREAK</div></div>
  <div class="stat"><div class="n" id="num">1/30</div><div class="l">QUESTION</div></div>
 </div>
</header>
<div class="grid">
<div class="card map" id="mapbox"><div class="loading">Loading realistic world map…</div></div>
<div class="card panel">
 <div class="eyebrow">FIND THE COUNTRY</div>
 <div class="prompt" id="prompt">Loading…</div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <div class="feedback" id="feedback">Loading the map.</div>
 <div class="hint" id="hintbox" style="display:none"></div>
 <div class="actions">
  <button class="secondary" id="hint">Show Hint</button>
  <button class="primary" id="next" disabled>Next Country</button>
  <button class="danger" id="restart">Restart & Shuffle</button>
 </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const wantedCountries=[
"Canada","United States of America","Mexico","Brazil","Argentina","Colombia","Peru",
"United Kingdom","France","Spain","Germany","Italy","Greece","Turkey","Ukraine","Russia",
"Egypt","Morocco","Nigeria","Ethiopia","South Africa","Saudi Arabia","Iran","Pakistan",
"India","China","Japan","South Korea","Indonesia","Australia"
];

const hints={
"Canada":"North America, directly above the United States.",
"United States of America":"North America, south of Canada and north of Mexico.",
"Mexico":"North America, directly south of the United States.",
"Brazil":"Largest country in South America, on the eastern side.",
"Argentina":"Southern South America, long and narrow.",
"Colombia":"Northwestern South America, near the Caribbean.",
"Peru":"Western South America, along the Pacific coast.",
"United Kingdom":"Island country northwest of mainland Europe.",
"France":"Western Europe, south of the United Kingdom.",
"Spain":"Southwestern Europe, below France.",
"Germany":"Central Europe, east of France.",
"Italy":"Southern Europe, shaped like a boot.",
"Greece":"Southeastern Europe, near the Mediterranean.",
"Turkey":"Between southeastern Europe and western Asia.",
"Ukraine":"Eastern Europe, west of Russia.",
"Russia":"Huge country stretching across northern Europe and Asia.",
"Egypt":"Northeastern Africa, next to the Mediterranean.",
"Morocco":"Northwestern Africa, near Spain.",
"Nigeria":"West Africa, along the Gulf of Guinea.",
"Ethiopia":"East Africa, inland near the Horn of Africa.",
"South Africa":"Southern tip of Africa.",
"Saudi Arabia":"Arabian Peninsula, between the Red Sea and Persian Gulf.",
"Iran":"Western Asia, east of Iraq.",
"Pakistan":"South Asia, west of India.",
"India":"South Asia, east of Pakistan.",
"China":"East Asia, west of the Pacific Ocean.",
"Japan":"Island country east of China and Korea.",
"South Korea":"Southern half of the Korean Peninsula.",
"Indonesia":"Large island country southeast of mainland Asia.",
"Australia":"Island continent southeast of Indonesia."
};

let features=[], q=[], i=0, score=0, streak=0, answered=false, svg, projection, path;

function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function normalize(n){
 return n==="United States of America"?"United States of America":n;
}
function loadQuestion(){
 answered=false;
 const name=q[i];
 document.getElementById("prompt").textContent=name==="United States of America"?"United States":name;
 document.getElementById("feedback").textContent="Click the country on the map. You only need the general area.";
 document.getElementById("next").disabled=true;
 document.getElementById("hintbox").style.display="none";
 document.getElementById("num").textContent=`${i+1}/${q.length}`;
 document.getElementById("bar").style.width=(i/q.length*100)+"%";
 document.querySelectorAll(".country").forEach(x=>x.classList.remove("correct","incorrect"));
}
function draw(){
 document.getElementById("mapbox").innerHTML="";
 svg=d3.select("#mapbox").append("svg").attr("viewBox","0 0 1000 520").attr("preserveAspectRatio","xMidYMid meet");
 svg.append("rect").attr("width",1000).attr("height",520).attr("rx",12).attr("fill","#dff3ff");
 projection=d3.geoNaturalEarth1().fitExtent([[8,8],[992,512]],{type:"FeatureCollection",features});
 path=d3.geoPath(projection);
 svg.selectAll(".country").data(features).join("path")
   .attr("class","country")
   .attr("d",path)
   .attr("data-name",d=>d.properties.NAME)
   .on("click",function(e,d){answer(d,this);});
}
function answer(d,node){
 if(answered)return;
 answered=true;
 const target=q[i];
 const clicked=d.properties.NAME;
 const good=clicked===target || (target==="United States of America" && clicked==="United States of America");
 if(good){
   score++;streak++;node.classList.add("correct");
   document.getElementById("feedback").textContent="Correct! You found it.";
 }else{
   streak=0;node.classList.add("incorrect");
   svg.selectAll(".country").filter(x=>x.properties.NAME===target).classed("correct",true);
   document.getElementById("feedback").textContent=`Not quite — ${target==="United States of America"?"the United States":target} is highlighted in green.`;
 }
 document.getElementById("score").textContent=score;
 document.getElementById("streak").textContent=streak;
 document.getElementById("next").disabled=false;
}
document.getElementById("hint").onclick=()=>{
 const name=q[i];document.getElementById("hintbox").style.display="block";
 document.getElementById("hintbox").textContent="Hint: "+hints[name];
};
document.getElementById("next").onclick=()=>{
 i++;
 if(i>=q.length){
  document.getElementById("prompt").textContent="Finished!";
  document.getElementById("feedback").textContent=`Final score: ${score}/${q.length}. Hit Restart & Shuffle for a new order.`;
  document.getElementById("next").disabled=true;document.getElementById("bar").style.width="100%";
 }else loadQuestion();
};
document.getElementById("restart").onclick=()=>{
 q=shuffle([...wantedCountries]);i=0;score=0;streak=0;
 document.getElementById("score").textContent=0;document.getElementById("streak").textContent=0;loadQuestion();
};
fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
.then(r=>r.json()).then(data=>{
 features=data.features.filter(f=>wantedCountries.includes(f.properties.NAME));
 draw();q=shuffle([...wantedCountries]);loadQuestion();
}).catch(()=>{
 document.getElementById("mapbox").innerHTML='<div class="loading">The realistic map could not load. Make sure you are connected to the internet, then refresh the page.</div>';
});
</script>
</body>
</html>
