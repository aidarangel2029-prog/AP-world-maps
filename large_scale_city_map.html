<!doctype html><html><head><meta charset="utf-8"><title>Large Scale City Map</title>
<style>
body{font-family:Arial;margin:0;background:#eef3f8;color:#172033}.app{max-width:1450px;margin:15px auto;padding:10px}header,.box{background:white;border:1px solid #d8e0ea;border-radius:16px;padding:16px;box-shadow:0 4px 15px #0001}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.sub{color:#64748b}.stats{display:flex;gap:8px}.stat{padding:7px 12px;border:1px solid #ddd;border-radius:9px;text-align:center}.n{font-weight:bold;font-size:18px}.l{font-size:9px;color:#64748b}.grid{display:grid;grid-template-columns:1fr 250px;gap:12px;margin-top:12px}.map{padding:7px}.map svg{width:100%;display:block;background:#dff3ff;border-radius:10px}.land{fill:#fff;stroke:#687585;stroke-width:.7}.city{fill:#172033;stroke:white;stroke-width:2;cursor:pointer}.city:hover{r:8}.good{fill:#16a34a}.bad{fill:#dc2626}.panel{min-height:540px;display:flex;flex-direction:column}.prompt{font-size:28px;font-weight:bold;margin:8px 0}.barbg{height:8px;background:#e5eaf0;border-radius:8px;margin:15px 0}.bar{height:100%;background:#2563eb;border-radius:8px}.feedback{background:#f7f9fb;border-radius:9px;padding:12px;min-height:60px}.hint{background:#eff6ff;color:#1d4ed8;padding:10px;border-radius:9px;margin-top:10px}.actions{margin-top:auto;display:grid;gap:8px}button{border:0;border-radius:9px;padding:12px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#e9eef5}.danger{background:#fee2e2;color:#991b1b}@media(max-width:850px){header{display:block}.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><div><h1>Large-Scale City Map Practice</h1><div class="sub">Zoomed in on the regions from your PDF • general area counts</div></div>
<div class="stats"><div class="stat"><div class="n" id="score">0</div><div class="l">CORRECT</div></div><div class="stat"><div class="n" id="streak">0</div><div class="l">STREAK</div></div><div class="stat"><div class="n" id="num">1/15</div><div class="l">QUESTION</div></div></div></header>
<div class="grid"><div class="box map" id="map"><div style="padding:40px;text-align:center">Loading map…</div></div>
<div class="box panel"><b style="font-size:11px;color:#64748b">FIND THE CITY</b><div class="prompt" id="prompt">Loading…</div><div class="barbg"><div class="bar" id="bar"></div></div><div class="feedback" id="feedback">Click the general area of the city.</div><div class="hint" id="hintbox" style="display:none"></div><div class="actions"><button class="secondary" id="hint">Show Hint</button><button class="primary" id="next" disabled>Next City</button><button class="danger" id="restart">Restart & Shuffle</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script>
const C=[
["Mecca",39.8579,21.3891,"western Saudi Arabia"],["Medina",39.8579,24.5247,"north of Mecca in Saudi Arabia"],
["Kufa",44.4,32.03,"southern Iraq, near the Euphrates"],["Basra",47.78,30.50,"far southern Iraq, near the Persian Gulf"],
["Baghdad",44.36,33.31,"central Iraq, on the Tigris"],["Mosul",43.13,36.34,"northern Iraq, on the Tigris"],
["Aleppo",37.16,36.20,"northern Syria"],["Damascus",36.29,33.51,"southern Syria"],
["Cairo",31.24,30.04,"northern Egypt, on the Nile"],["Fustat",31.23,29.99,"just south of Cairo"],
["Jerusalem",35.21,31.77,"the Levant, west of the Dead Sea"],["Antioch",36.16,36.20,"southern Turkey, near the Mediterranean"],
["Alexandria",29.92,31.20,"northern Egypt, on the Mediterranean"],["Nishapur",58.80,36.21,"northeastern Iran"],["Qairawan",10.10,35.68,"central Tunisia"]
];
let q=[],i=0,score=0,streak=0,answered=false,svg,proj,nodes;
function shuffle(a){for(let j=a.length-1;j;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function load(){answered=false;document.getElementById("next").disabled=true;document.getElementById("prompt").textContent=q[i][0];document.getElementById("feedback").textContent="Click the general area. You do NOT need the exact spot.";document.getElementById("hintbox").style.display="none";document.getElementById("num").textContent=(i+1)+"/"+q.length;document.getElementById("bar").style.width=(i/q.length*100)+"%";nodes.classed("good",false).classed("bad",false)}
function draw(d){document.getElementById("map").innerHTML="";svg=d3.select("#map").append("svg").attr("viewBox","0 0 1200 700");svg.append("rect").attr("width",1200).attr("height",700).attr("rx",10).attr("fill","#dff3ff");
proj=d3.geoMercator().scale(1550).center([31,31]).translate([600,350]);let path=d3.geoPath(proj);
svg.selectAll(".land").data(d.features).join("path").attr("class","land").attr("d",path);
nodes=svg.selectAll(".city").data(C).join("circle").attr("class","city").attr("r",6).attr("cx",d=>proj([d[1],d[2]])[0]).attr("cy",d=>proj([d[1],d[2]])[1]).on("click",function(e,d){answer(d,this)});
svg.append("text").attr("x",25).attr("y",30).attr("font-size",16).attr("font-weight","bold").attr("fill","#526579").text("NORTH AFRICA • LEVANT • ARABIA • IRAQ • IRAN")}
function answer(x,n){if(answered)return;answered=true;let t=q[i],a=proj([x[1],x[2]]),b=proj([t[1],t[2]]),ok=Math.hypot(a[0]-b[0],a[1]-b[1])<48;if(ok){score++;streak++;n.classList.add("good");document.getElementById("feedback").textContent="Correct!"}else{streak=0;n.classList.add("bad");nodes.filter(d=>d[0]==t[0]).classed("good",true);document.getElementById("feedback").textContent="Not quite — the correct city is green."}document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("next").disabled=false}
document.getElementById("hint").onclick=()=>{document.getElementById("hintbox").style.display="block";document.getElementById("hintbox").textContent="Hint: "+q[i][3]};
document.getElementById("next").onclick=()=>{if(++i<q.length)load();else{document.getElementById("prompt").textContent="Finished!";document.getElementById("feedback").textContent="Score: "+score+"/"+q.length;document.getElementById("next").disabled=true;document.getElementById("bar").style.width="100%"}};
document.getElementById("restart").onclick=()=>{q=shuffle([...C]);i=0;score=0;streak=0;document.getElementById("score").textContent=0;document.getElementById("streak").textContent=0;load()};
fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson").then(r=>r.json()).then(d=>{draw(d);q=shuffle([...C]);load()});
</script></body></html>
