<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Cities Map Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:1250px;margin:20px auto;padding:0 16px}
header,.card{background:#fff;border:1px solid #d9e1ec;border-radius:18px;box-shadow:0 5px 20px #0000000b}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:25px}.sub{color:#64748b;font-size:14px;margin-top:3px}
.stats{display:flex;gap:8px}.stat{padding:8px 13px;border:1px solid #e2e8f0;border-radius:11px;text-align:center}.n{font-weight:800;font-size:18px}.l{font-size:10px;color:#64748b}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px;margin-top:15px}
.map{padding:10px}.map svg{width:100%;height:auto;display:block;background:#dff3ff;border-radius:12px}
.country{fill:#fff;stroke:#64748b;stroke-width:.55}.city{fill:#172033;stroke:#fff;stroke-width:2;cursor:pointer}.city:hover{r:7}.target{fill:#16a34a}.wrong{fill:#dc2626}
.panel{padding:21px;display:flex;flex-direction:column;min-height:560px}.eyebrow{font-size:12px;color:#64748b;font-weight:700;letter-spacing:.08em}
.prompt{font-size:28px;font-weight:850;margin:8px 0}.progress{height:8px;background:#e7edf4;border-radius:9px;margin:17px 0}.bar{height:100%;background:#2563eb;border-radius:9px;transition:.2s}
.feedback{padding:12px;background:#f8fafc;border-radius:11px;min-height:70px;font-size:14px;line-height:1.45}
.hint{margin-top:12px;background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:10px;font-size:13px}
.actions{margin-top:auto;display:grid;gap:9px;padding-top:16px}button{border:0;border-radius:10px;padding:12px;font-weight:750;cursor:pointer;font-size:14px}
.primary{background:#2563eb;color:white}.secondary{background:#e9eef5;color:#172033}.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}.legend{font-size:11px;color:#64748b;padding:8px 3px 0}
.loading{padding:30px;text-align:center;color:#64748b}
@media(max-width:850px){header{display:block}.stats{margin-top:12px}.grid{grid-template-columns:1fr}.panel{min-height:0}.actions{margin-top:15px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><h1>PDF Cities Map Practice</h1><div class="sub">Cities from the geography/history material • click the general area</div></div>
 <div class="stats">
  <div class="stat"><div class="n" id="score">0</div><div class="l">CORRECT</div></div>
  <div class="stat"><div class="n" id="streak">0</div><div class="l">STREAK</div></div>
  <div class="stat"><div class="n" id="num">1/15</div><div class="l">QUESTION</div></div>
 </div>
</header>
<div class="grid">
<div class="card map" id="mapbox"><div class="loading">Loading realistic world map…</div></div>
<div class="card panel">
 <div class="eyebrow">FIND THE CITY</div>
 <div class="prompt" id="prompt">Loading…</div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <div class="feedback" id="feedback">Click the approximate location of the city.</div>
 <div class="hint" id="hintbox" style="display:none"></div>
 <div class="actions">
  <button class="secondary" id="hint">Show Hint</button>
  <button class="primary" id="next" disabled>Next City</button>
  <button class="danger" id="restart">Restart & Shuffle</button>
 </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const cities=[
["Mecca",39.8579,21.3891,"Western Saudi Arabia, inland from the Red Sea."],
["Medina",39.8579,24.5247,"Saudi Arabia, north of Mecca."],
["Kufa",44.4,32.03,"Iraq, near the Euphrates and south of Baghdad."],
["Basra",47.78,30.5,"Southern Iraq, near the head of the Persian Gulf."],
["Baghdad",44.36,33.31,"Central Iraq, on the Tigris River."],
["Mosul",43.13,36.34,"Northern Iraq, on the Tigris."],
["Aleppo",37.16,36.20,"Northern Syria, near the Turkish border."],
["Damascus",36.29,33.51,"Southwestern Syria, near Lebanon."],
["Cairo",31.24,30.04,"Northern Egypt, on the Nile."],
["Fustat",31.23,29.99,"Old settlement just south of modern Cairo."],
["Jerusalem",35.21,31.77,"Holy city in the Levant, west of the Dead Sea."],
["Antioch",36.16,36.20,"Ancient city near the Mediterranean, in modern southern Turkey."],
["Alexandria",29.92,31.20,"Northern Egypt on the Mediterranean coast."],
["Nishapur",58.80,36.21,"Northeastern Iran, near the border with Turkmenistan."],
["Qairawan",10.10,35.68,"Central Tunisia in North Africa."]
];

let q=[],i=0,score=0,streak=0,answered=false,svg,projection,path,cityNodes;
function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function load(){
 answered=false;document.getElementById("next").disabled=true;
 document.getElementById("prompt").textContent=q[i][0];
 document.getElementById("feedback").textContent="Click the general area. You do NOT need to hit the exact city.";
 document.getElementById("hintbox").style.display="none";
 document.getElementById("num").textContent=`${i+1}/${q.length}`;
 document.getElementById("bar").style.width=(i/q.length*100)+"%";
 cityNodes.classed("target",false).classed("wrong",false);
}
function draw(data){
 document.getElementById("mapbox").innerHTML="";
 svg=d3.select("#mapbox").append("svg").attr("viewBox","0 0 1000 520");
 svg.append("rect").attr("width",1000).attr("height",520).attr("rx",12).attr("fill","#dff3ff");
 const fc={type:"FeatureCollection",features:data.features};
 projection=d3.geoNaturalEarth1().fitExtent([[8,8],[992,512]],fc);
 path=d3.geoPath(projection);
 svg.selectAll(".country").data(data.features).join("path").attr("class","country").attr("d",path);
 cityNodes=svg.selectAll(".city").data(cities).join("circle").attr("class","city").attr("r",4.5)
   .attr("cx",d=>projection([d[1],d[2]])[0]).attr("cy",d=>projection([d[1],d[2]])[1])
   .on("click",function(e,d){if(answered)return;answer(d,this);});
}
function answer(clicked,node){
 answered=true;const target=q[i],targetXY=projection([target[1],target[2]]);
 const clickedXY=projection([clicked[1],clicked[2]]);
 const distance=Math.hypot(targetXY[0]-clickedXY[0],targetXY[1]-clickedXY[1]);
 const good=distance<35;
 if(good){score++;streak++;node.classList.add("target");document.getElementById("feedback").textContent="Correct! Nice map reading."}
 else{streak=0;node.classList.add("wrong");cityNodes.filter(d=>d[0]===target[0]).classed("target",true);document.getElementById("feedback").textContent="Not quite — the correct city is marked in green."}
 document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("next").disabled=false;
}
document.getElementById("hint").onclick=()=>{document.getElementById("hintbox").style.display="block";document.getElementById("hintbox").textContent="Hint: "+q[i][3]};
document.getElementById("next").onclick=()=>{i++;if(i>=q.length){document.getElementById("prompt").textContent="Finished!";document.getElementById("feedback").textContent=`Final score: ${score}/${q.length}. Restart to get a new order.`;document.getElementById("next").disabled=true;document.getElementById("bar").style.width="100%"}else load()};
document.getElementById("restart").onclick=()=>{q=shuffle([...cities]);i=0;score=0;streak=0;document.getElementById("score").textContent=0;document.getElementById("streak").textContent=0;load()};

fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
.then(r=>r.json()).then(data=>{draw(data);q=shuffle([...cities]);load()})
.catch(()=>document.getElementById("mapbox").innerHTML='<div class="loading">The realistic map could not load. Refresh while connected to the internet.</div>');
</script>
</body>
</html>
